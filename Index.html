<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rulebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Alegreya+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0ec; --surface:#ffffff; --raised:#f7f8f5; --ink:#1e2420; --muted:#5f6760; --faint:#8a918a;
  --line:#dcdfd9; --hover:rgba(30,36,32,.05);
  --gm:#2e6a4c; --gm-soft:#e3efe7; --pl:#6a4c9c; --pl-soft:#ece6f5;
  --off:#34648f; --off-soft:#e2ecf5; --mod:#9a600f; --mod-soft:#f7ecd9; --cus:#a8435a; --cus-soft:#f7e4e8;
  --danger:#b83a34; --shadow:rgba(20,28,22,.14);
  --acc:#1e2420; --acc-soft:#e3e6e0; --on-acc:#ffffff;
  --serif:"Alegreya",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans",ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media screen and (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121513; --surface:#1a1e1b; --raised:#20251f; --ink:#e6e8e3; --muted:#a0a79f; --faint:#788078;
  --line:#2d332e; --hover:rgba(255,255,255,.05);
  --gm:#72c197; --gm-soft:#1d2f25; --pl:#b297e2; --pl-soft:#29223a;
  --off:#82b2de; --off-soft:#1b2836; --mod:#e2aa52; --mod-soft:#33291a; --cus:#e68fa0; --cus-soft:#37222a;
  --danger:#e3726b; --shadow:rgba(0,0,0,.5); --acc:#e6e8e3; --acc-soft:#262b27; --on-acc:#121513;
}}
:root[data-theme="dark"]{
  --bg:#121513; --surface:#1a1e1b; --raised:#20251f; --ink:#e6e8e3; --muted:#a0a79f; --faint:#788078;
  --line:#2d332e; --hover:rgba(255,255,255,.05);
  --gm:#72c197; --gm-soft:#1d2f25; --pl:#b297e2; --pl-soft:#29223a;
  --off:#82b2de; --off-soft:#1b2836; --mod:#e2aa52; --mod-soft:#33291a; --cus:#e68fa0; --cus-soft:#37222a;
  --danger:#e3726b; --shadow:rgba(0,0,0,.5); --acc:#e6e8e3; --acc-soft:#262b27; --on-acc:#121513;
}
[data-role="gm"]{--acc:var(--gm);--acc-soft:var(--gm-soft)}
[data-role="pl"]{--acc:var(--pl);--acc-soft:var(--pl-soft)}
@media screen and (prefers-color-scheme:dark){ :root:not([data-theme="light"]) [data-role]{--on-acc:#121513} }
:root[data-theme="dark"] [data-role]{--on-acc:#121513}

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
#root{height:100%}
.i{flex:none;display:block}
.muted{color:var(--muted)}

/* ---------- Buttons & fields ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid transparent;border-radius:7px;background:var(--acc);color:var(--on-acc);font-weight:700;font-size:15px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);font-weight:500}
.btn.ghost:hover{background:var(--raised);filter:none}
.btn.danger{background:var(--danger);color:#fff}
.field{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--surface);font-size:16px}
.field:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
textarea.field{resize:vertical;min-height:90px;font-family:var(--serif);font-size:17px;line-height:1.55}
label.lb{font-size:14px;font-weight:500;color:var(--muted);margin-top:10px}
.err{color:var(--danger);font-size:14px;min-height:20px}

/* ---------- Hex cover ---------- */
.cover{position:relative;height:170px;background:var(--acc-soft);color:var(--acc);overflow:hidden;flex:none}
.cover svg{position:absolute;inset:0}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:60px;background:linear-gradient(to bottom,transparent,var(--acc-soft))}

/* ---------- Login ---------- */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);height:100%}
.auth-form{display:flex;flex-direction:column;justify-content:center;padding:40px clamp(24px,7vw,96px);background:var(--surface);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:auto;padding-bottom:40px;color:var(--gm)}
.brand span{color:var(--ink)}
.auth h1{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
.auth .sub{color:var(--muted);margin:0 0 24px;max-width:26em}
.auth form{display:flex;flex-direction:column;gap:4px;max-width:360px}
.auth form .btn{justify-content:center;margin-top:10px;padding:10px}
.or{display:flex;align-items:center;gap:12px;color:var(--faint);font-size:14px;margin:14px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.swap{margin-top:22px;color:var(--muted);font-size:15px;margin-bottom:auto}
.linkbtn{background:none;border:0;padding:0;color:var(--acc);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.auth-art{position:relative;background:var(--gm-soft);color:var(--gm);display:grid;place-items:center;padding:40px;overflow:hidden}
.auth-art>svg{position:absolute;inset:0}
.preview{position:relative;width:min(400px,100%);background:var(--surface);border-radius:14px;box-shadow:0 1px 0 var(--line),0 24px 60px var(--shadow);padding:22px 24px;color:var(--ink)}
.preview .ph{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.preview .ph .tile{width:34px;height:34px}
.preview h3{margin:0;font-family:var(--serif);font-size:21px}
.preview .pr{padding:12px 0;border-top:1px solid var(--line)}
.preview .pr:first-of-type{border-top:0}
.preview .pr b{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:15px}
.preview .pr p{margin:4px 0 0;font-family:var(--serif);font-size:15.5px;color:var(--muted);line-height:1.45}
.art-cap{position:relative;margin-top:22px;color:var(--gm);font-weight:500;text-align:center;max-width:24em}

/* ---------- Shell ---------- */
.app{display:flex;height:100%}
.sidebar{width:252px;flex:none;background:var(--bg);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto;border-right:1px solid var(--line)}
.sidebar .brand{padding:4px 10px 18px;margin:0;font-size:19px}
.nav-sec{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--muted);padding:16px 10px 6px}
.dot{width:8px;height:8px;border-radius:50%}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:6px 10px;min-height:34px;border:0;border-radius:7px;background:none;font-size:15.5px;color:var(--muted)}
.nav:hover{background:var(--hover);color:var(--ink)}
.nav.active{background:var(--acc-soft);color:var(--acc);font-weight:700}
.nav.sub{padding-left:28px;font-size:15px}
.nav.sub .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar .spacer{flex:1;min-height:20px}
.who{display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);margin-top:8px}
.who .av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.who div{min-width:0;flex:1;font-size:14px;line-height:1.25}
.who small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;border-radius:7px;padding:6px;color:var(--muted);display:grid;place-items:center}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;background:var(--surface)}
.topbar{height:50px;flex:none;display:flex;align-items:center;gap:4px;padding:0 14px;font-size:15px;border-bottom:1px solid var(--line)}
.crumb{background:none;border:0;padding:3px 7px;border-radius:6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
button.crumb:hover{background:var(--hover);color:var(--ink)}
.crumb.here{color:var(--ink);font-weight:500}
.crumb-sep{color:var(--faint)}
.menu-btn{display:none}
.scroll{flex:1;overflow-y:auto}
.page{max-width:820px;margin:0 auto;padding:0 48px 120px}
.tile{width:76px;height:76px;border-radius:16px;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;box-shadow:0 0 0 5px var(--surface)}
.page>.tile{margin-top:-42px;position:relative}
.page h1{font-family:var(--serif);font-size:42px;font-weight:700;line-height:1.12;margin:18px 0 8px;letter-spacing:-.01em}
.lede{color:var(--muted);font-size:18px;max-width:34em;margin:0}
.page h2{font-size:21px;font-weight:800;margin:40px 0 12px;display:flex;align-items:center;gap:10px}
.page h2 .grow{flex:1}
.page h3{font-size:18px;font-weight:800;margin:26px 0 6px}
.props{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;margin:18px 0;font-size:16px}
.props dt{color:var(--muted)}
.props dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}

.tag{display:inline-block;font-size:13px;font-weight:700;line-height:20px;padding:0 8px;border-radius:4px;white-space:nowrap;background:var(--raised);color:var(--muted)}
.tag.off{background:var(--off-soft);color:var(--off)} .tag.mod{background:var(--mod-soft);color:var(--mod)} .tag.cus{background:var(--cus-soft);color:var(--cus)}

.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:10px;background:var(--acc-soft);margin:20px 0;font-size:16px}
.note .i{color:var(--acc);margin-top:2px}

/* ---------- List rows ---------- */
.list{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lrow{position:relative;display:flex;align-items:center;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lopen{flex:1;min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;background:none;border:0;padding:14px 8px 14px 16px;border-radius:12px}
.lrow:hover{background:var(--raised)}
.lrow:first-child,.lrow:first-child .lopen{border-top-left-radius:12px;border-top-right-radius:12px}
.lrow:last-child,.lrow:last-child .lopen{border-bottom-left-radius:12px;border-bottom-right-radius:12px}
.lic{width:36px;height:36px;border-radius:9px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.lmain{min-width:0}
.lmain b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmain span{display:block;color:var(--muted);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.lrow .iconbtn{margin-right:10px}
.pop{position:absolute;right:10px;top:calc(100% - 6px);z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px var(--shadow);padding:5px;min-width:170px}
.pop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:7px 10px;border-radius:6px;font-size:15px}
.pop button:hover{background:var(--hover)}
.pop button.bad{color:var(--danger)}
.addrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;color:var(--muted);font-size:15.5px;border-radius:0 0 12px 12px}
.addrow:hover{background:var(--raised);color:var(--acc)}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 20px;gap:8px}
.empty .art{width:72px;height:72px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;margin-bottom:4px}
.empty b{font-size:18px}
.empty p{margin:0 0 8px;color:var(--muted);max-width:26em}

/* ---------- Home choices ---------- */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.choice{text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:0;overflow:hidden}
.choice:hover{border-color:var(--acc);box-shadow:0 8px 26px var(--shadow)}
.choice .mini{position:relative;height:92px;background:var(--acc-soft);color:var(--acc)}
.choice .mini svg{position:absolute;inset:0}
.choice .mini .tile{position:absolute;left:20px;bottom:-26px;width:54px;height:54px;border-radius:12px}
.choice .ct{padding:38px 20px 20px}
.choice b{display:block;font-size:20px;font-weight:800;margin-bottom:4px}
.choice span{color:var(--muted);font-size:16px}

/* ---------- Rules ---------- */
.toolbar{display:flex;flex-direction:column;gap:12px;margin:28px 0 4px}
.searchbox{position:relative}
.searchbox .i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.searchbox .field{padding-left:40px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 13px;font-size:14.5px;color:var(--muted)}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}
.grp{margin-top:18px}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 0;font-size:20px;font-weight:800;border-bottom:2px solid var(--ink)}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .chev{transition:transform .15s;color:var(--muted)}
.grp[open]>summary .chev{transform:rotate(90deg)}
.grp>summary .n{font-weight:500;color:var(--faint);font-size:16px}
.rule{padding:16px 0;border-bottom:1px solid var(--line)}
.rule header{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rule h4{margin:0;font-size:18px;font-weight:800}
.rule header .grow{flex:1}
.rtext{font-family:var(--serif);font-size:18.5px;line-height:1.6;margin:6px 0 0;max-width:38em}
.orig{margin-top:8px}
.orig summary{cursor:pointer;color:var(--muted);font-size:14.5px;width:max-content}
.orig p{font-family:var(--serif);color:var(--muted);font-size:16.5px;margin:6px 0 0;padding-left:12px;border-left:2px solid var(--line)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.cmp>div{border-radius:10px;padding:12px 14px;background:var(--raised)}
.cmp>div.yours{background:var(--mod-soft)}
.cmp small{display:block;font-weight:700;color:var(--muted);font-size:13.5px;margin-bottom:4px}
.cmp .yours small{color:var(--mod)}
.cmp p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.5}
.act{background:none;border:1px solid transparent;padding:3px 10px;border-radius:6px;font-size:14.5px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.act:hover{background:var(--hover);color:var(--ink)}
.act.bad:hover{color:var(--danger)}

.panel{border:1px solid var(--line);border-radius:12px;padding:20px;margin:12px 0;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.panel .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

/* ---------- Modal / toast ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,14,11,.5);display:grid;place-items:center;padding:20px;z-index:50}
.modal{background:var(--surface);border-radius:14px;box-shadow:0 24px 64px var(--shadow);width:100%;max-width:460px;padding:26px}
.modal h3{margin:0 0 6px;font-family:var(--serif);font-size:24px}
.copyline{display:flex;gap:8px;margin-top:16px}
.copyline input{flex:1;min-width:0}
.access{margin-top:18px;font-size:16px}
.people{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.person{display:flex;align-items:center;gap:6px;background:var(--raised);border-radius:999px;padding:3px 10px 3px 3px;font-size:14.5px}
.person i{width:22px;height:22px;border-radius:50%;background:var(--pl-soft);color:var(--pl);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.modal .row{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.toast{white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:15px;font-weight:500;z-index:60}


/* ---------- Topbar extras ---------- */
.topbar .tb-right{margin-left:auto;display:flex;gap:4px}
.tb-dice{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:7px;padding:4px 10px;font-size:14.5px;color:var(--ink)}
.tb-dice:hover{background:var(--hover)}
.scrim{display:none}
.tabbar{display:none}
.print-only{display:none}

/* ---------- Dice tray ---------- */
.modal.dice{max-width:520px}
.dgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.die{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 0 8px;font-weight:800;font-size:14.5px;color:var(--muted)}
.die:hover{border-color:var(--ink);color:var(--ink)}
.die.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.die svg{width:24px;height:24px}
.dctl{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px}
.dctl>div{display:flex;flex-direction:column;gap:4px}
.dctl label{font-size:14px;font-weight:500;color:var(--muted)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{background:none;border:0;width:40px;height:38px;display:grid;place-items:center;color:var(--muted)}
.step button:hover{background:var(--hover);color:var(--ink)}
.step output{min-width:48px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.rollbtn{width:100%;justify-content:center;margin-top:18px;padding:12px;font-size:17px;background:var(--ink);color:var(--surface)}
.dres{margin-top:18px;border-radius:12px;background:var(--raised);padding:18px;text-align:center;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.dres .tot{font-family:var(--serif);font-size:56px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.dres .tot.crit{color:var(--gm)} .dres .tot.fumble{color:var(--danger)}
.dres .lbl{color:var(--muted);font-size:15px}
.faces{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.face{min-width:34px;height:34px;padding:0 8px;border-radius:8px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.face.drop{opacity:.4;text-decoration:line-through}
.face.max{border-color:var(--gm);color:var(--gm)} .face.min{border-color:var(--danger);color:var(--danger)}
.dres.fresh .tot,.dres.fresh .face{animation:tumble .35s ease-out}
@keyframes tumble{0%{transform:rotate(-25deg) scale(.6);opacity:0}70%{transform:rotate(6deg) scale(1.08);opacity:1}100%{transform:none}}
.dhist{margin-top:18px}
.dhist b{font-size:15px}
.dhist ol{list-style:none;margin:6px 0 0;padding:0;font-size:15px}
.dhist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line);color:var(--muted)}
.dhist li strong{color:var(--ink);font-variant-numeric:tabular-nums}
.fair{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);margin-top:4px}

/* ---------- Condition links & cards ---------- */
.cl{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-decoration-color:var(--acc);text-decoration-thickness:1.5px;text-underline-offset:3px;cursor:help}
.cl:hover{color:var(--acc)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.cond{border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--surface)}
.cond h3{margin:0;font-size:19px;font-weight:800}
.csum{margin:4px 0 8px;color:var(--muted);font-size:15.5px}
.cond ul,.cond ol{margin:0;padding-left:20px;font-family:var(--serif);font-size:17px;line-height:1.5}
.cond li{margin:3px 0}
.cond ol.lv{margin-top:8px;font-size:16px}
.modal .cond{border:0;padding:0}
/* ---------- Rulings ---------- */
.ruling{padding:14px 0;border-bottom:1px solid var(--line)}
.ruling .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.ruling .q{font-weight:800;font-size:17px;margin:4px 0 2px}
.ruling .a{font-family:var(--serif);font-size:18px;line-height:1.55;margin:0}
.rul-inline{margin-top:10px;border-left:3px solid var(--acc);background:var(--acc-soft);border-radius:0 8px 8px 0;padding:8px 12px}
.rul-inline b{font-size:13.5px}
.rul-inline p{margin:2px 0 0;font-family:var(--serif);font-size:16.5px;line-height:1.5}
/* ---------- Saved rolls ---------- */
.modal.dice{max-height:92vh;overflow-y:auto}
.presets{margin-top:20px}
.presets>div>b{font-size:16px}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pchip{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.pchip:hover{border-color:var(--ink)}
.pchip button{background:none;border:0}
.pr-go{display:flex;flex-direction:column;align-items:flex-start;padding:7px 4px 7px 12px;text-align:left}
.pr-go b{font-size:15px}
.pr-go span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pchip .px{padding:0 8px;color:var(--faint)}
.pchip .px:hover{color:var(--danger)}
.pform{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;display:flex;flex-direction:column;gap:2px}
.hint{font-size:13.5px;color:var(--muted)}
.dsplit{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.dsplit>div{display:flex;flex-direction:column;align-items:center;gap:6px}
.dsplit small{font-weight:700;color:var(--muted);font-size:13.5px}
.dres .tot.sm{font-size:44px}

@media (max-width:860px){
  .auth{grid-template-columns:1fr}
  .auth-art{display:none}
  .auth-form{padding:32px 24px}
}
@media (max-width:760px){
  body{font-size:16px}
  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:40;width:min(290px,85vw);transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px var(--shadow);
    padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .sidebar.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;z-index:39;background:rgba(10,14,11,.4)}
  .nav{min-height:44px}
  .menu-btn{display:grid}
  .iconbtn{padding:10px}
  .topbar{padding:0 6px;height:54px}
  .topbar .crumb:not(.here),.topbar .crumb-sep{display:none}
  .crumb.here{max-width:60vw;font-weight:700}
  .tb-dice{display:none}
  .page{padding:0 16px calc(110px + env(safe-area-inset-bottom,0px))}
  .page h1{font-size:30px}
  .page>.tile{width:62px;height:62px;margin-top:-34px}
  .lede{font-size:16.5px}
  .page h2{flex-wrap:wrap;font-size:19px}
  .cover{height:110px}
  .choices,.cmp,.two,.cgrid{grid-template-columns:1fr}
  .lmeta{display:none}
  .lopen{padding:12px 4px 12px 12px;gap:12px}
  .lrow .iconbtn{margin-right:4px}
  .pop button{padding:12px}
  .act{padding:8px 12px}
  .chip{padding:6px 14px}
  .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .rtext{font-size:17.5px}
  .btn{padding:10px 16px}
  .actions .btn{flex:1;justify-content:center}
  .panel{padding:16px}
  .props{gap:4px 16px}
  .copyline{flex-direction:column}
  .copyline .btn{justify-content:center}
  .overlay{place-items:end stretch;padding:0}
  .modal{max-width:none!important;border-radius:18px 18px 0 0;max-height:92vh;overflow-y:auto;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}
  .modal .row .btn{flex:1;justify-content:center}
  .dgrid{grid-template-columns:repeat(4,1fr)}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:8px 0 7px;font-size:12px;font-weight:500;color:var(--muted);min-height:58px}
  .tabbar button.on{color:var(--acc);font-weight:800}
  .tabbar .dicetab .i{color:var(--surface);background:var(--ink);border-radius:9px;padding:4px;width:32px;height:32px;margin-top:-2px}
  .toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
}
@media print{
  @page{margin:15mm 14mm}
  html,body,#root,.app,.main,.scroll{height:auto!important;overflow:visible!important;display:block!important;background:#fff!important}
  body{font-size:11pt;color:#000}
  .sidebar,.topbar,.cover,.tabbar,.toolbar,.actions,.scrim,.toast,.overlay,.orig>summary,.page>.tile,.note,.no-print{display:none!important}
  .print-only{display:block!important}
  .page{max-width:none;padding:0!important;margin:0}
  .page h1{font-size:24pt;margin:0 0 2pt}
  .lede{font-size:11pt}
  .props{margin:6pt 0 10pt;font-size:10pt}
  .ph-head{border-bottom:2pt solid #000;padding-bottom:6pt;margin-bottom:6pt;font-size:9.5pt;color:#444;display:flex!important;justify-content:space-between;gap:12pt}
  .grp{margin-top:10pt;break-inside:auto}
  .grp>summary{font-size:13pt;border-bottom:1.5pt solid #000;break-after:avoid}
  .grp>summary .chev{display:none}
  .rule{padding:6pt 0;break-inside:avoid;border-bottom:.5pt solid #bbb}
  .rule h4{font-size:11pt}
  .rtext{font-size:11pt;line-height:1.4;max-width:none}
  .orig{margin-top:3pt}
  .orig p{font-size:9.5pt;color:#444;border-left:1.5pt solid #999}
  .orig p::before{content:"Official rule: ";font-family:var(--sans);font-weight:700}
  .cl{text-decoration:none;color:#000}
  .ruling,.cond{break-inside:avoid}
  .rul-inline{background:none;border-left:1.5pt solid #000}
  .rul-inline p,.ruling .a{font-size:10.5pt}
  .tag{background:none!important;color:#000!important;border:.75pt solid #777;font-size:8pt;line-height:13pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Hex battle-map pattern with a few highlighted cells */
const HW=38.1, HH=66;
function cellPts(i,j,off){const cx=off?HW*i:HW/2+HW*i, cy=off?55+HH*j:22+HH*j;
  return [[cx,cy-22],[cx+19.05,cy-11],[cx+19.05,cy+11],[cx,cy+22],[cx-19.05,cy+11],[cx-19.05,cy-11]].map(p=>p.join(",")).join(" ");}
let hexN=0;
function hex(cells=[]){
  const id="hx"+(hexN++);
  return `<svg aria-hidden="true" width="100%" height="100%"><defs><pattern id="${id}" width="${HW}" height="${HH}" patternUnits="userSpaceOnUse">
  <path d="M19.05 0L38.1 11V33L19.05 44L0 33V11Z M19.05 44V66" fill="none" stroke="currentColor" stroke-opacity=".28" stroke-width="1"/></pattern></defs>
  <rect width="100%" height="100%" fill="url(#${id})"/>
  ${cells.map(([i,j,o,a])=>`<polygon points="${cellPts(i,j,o)}" fill="currentColor" fill-opacity="${a||.16}"/>`).join("")}</svg>`;
}
const GM_CELLS=[[13,0,1,.12],[13,1,0,.18],[14,1,1,.18],[14,1,0,.26],[15,1,1,.4],[17,0,0,.1],[18,1,1,.14]];

/* ---------- Official D&D 5e rules ---------- */
const OFFICIAL = [
  {id:"adv",cat:"General",title:"Advantage and disadvantage",text:"Roll two d20s and use the higher result (advantage) or the lower one (disadvantage). Multiple sources don't stack, and having both cancels them out."},
  {id:"insp",cat:"General",title:"Inspiration",text:"The GM can award inspiration for good roleplay. Spend it to gain advantage on one attack roll, saving throw, or ability check."},
  {id:"crit",cat:"Combat",title:"Critical hits",text:"On a natural 20, roll all of the attack's damage dice twice, then add your modifiers once."},
  {id:"opp",cat:"Combat",title:"Opportunity attacks",text:"When a hostile creature you can see leaves your reach, you can use your reaction to make one melee attack against it."},
  {id:"grap",cat:"Combat",title:"Grappling",text:"Replace one attack with a Strength (Athletics) check contested by the target's Athletics or Acrobatics. On a success, the target's speed becomes 0."},
  {id:"cover",cat:"Combat",title:"Cover",text:"Half cover grants +2 to AC and Dexterity saves. Three-quarters cover grants +5. Total cover means you can't be targeted directly."},
  {id:"death",cat:"Combat",title:"Death saving throws",text:"At 0 hit points, roll a d20 at the start of each turn: 10 or higher is a success. Three successes stabilize you; three failures and you die. A natural 20 restores 1 hit point."},
  {id:"conc",cat:"Spellcasting",title:"Concentration",text:"When you take damage while concentrating, make a Constitution save against DC 10 or half the damage taken, whichever is higher. On a failure, the spell ends."},
  {id:"short",cat:"Resting",title:"Short rest",text:"At least one hour of light activity. You can spend Hit Dice to regain hit points."},
  {id:"long",cat:"Resting",title:"Long rest",text:"At least eight hours, mostly sleeping. Regain all hit points and up to half your total Hit Dice. Only one long rest per 24 hours."}
];
const CATS=["General","Combat","Spellcasting","Resting","Homebrew"];


/* ---------- Conditions (D&D 5e SRD 5.1, summarized) ---------- */
const CONDS=[
 {id:"blinded",name:"Blinded",sum:"You can't see.",fx:["You automatically fail any ability check that requires sight.","Attack rolls against you have advantage.","Your attack rolls have disadvantage."]},

/* ---------- Dice: unbiased rolls from the browser's cryptographic random generator ---------- */
function rollDie(sides){
  const buf=new Uint32Array(1), limit=Math.floor(4294967296/sides)*sides;
  let x;
  do{ crypto.getRandomValues(buf); x=buf[0]; }while(x>=limit); // reject the uneven tail so every face is exactly equally likely
  return x%sides+1;
}
const DICE=[4,6,8,10,12,20,100];
// Parse dice notation like "1d20+5", "2d6+1d8-1" or "1d20+3 adv"
function parseExpr(str){
  let s=String(str||"").toLowerCase().trim(),mode="normal";
  const m=s.match(/(advantage|adv|disadvantage|dis)\s*$/);
  if(m){mode=m[1].startsWith("a")?"adv":"dis";s=s.slice(0,m.index);}
  s=s.replace(/\s+/g,"");
  if(!/^[+-]?(\d*d\d+|\d+)([+-](\d*d\d+|\d+))*$/.test(s))return null;
  const terms=[];let mod=0,ok=true;
  for(const t of s.match(/[+-]?(\d*d\d+|\d+)/g)){
    const sign=t[0]==="-"?-1:1,b=t.replace(/^[+-]/,"");
    if(b.includes("d")){const [n,sd]=b.split("d"),cnt=n?+n:1,sides=+sd;if(!DICE.includes(sides)||cnt<1||cnt>50)ok=false;terms.push({n:cnt,sides,sign});}
    else mod+=sign*(+b);
  }
  if(!ok||!terms.length||Math.abs(mod)>999)return null;
  return {terms,mod,mode};
}
function exprLabel(e,withMode=true){
  return e.terms.map((t,i)=>(t.sign<0?"-":i?"+":"")+t.n+"d"+t.sides).join("")+(e.mod>0?"+"+e.mod:e.mod<0?String(e.mod):"")
    +(withMode&&e.mode!=="normal"&&e.terms.some(t=>t.sides===20)?(e.mode==="adv"?" with advantage":" with disadvantage"):"");
}
function rollExpr(e,double){
  const faces=[];let sum=0;
  e.terms.forEach(t=>{
    for(let k=0;k<t.n*(double?2:1);k++){
      if(t.sides===20&&e.mode!=="normal"){
        const a=rollDie(20),b=rollDie(20),keep=e.mode==="adv"?Math.max(a,b):Math.min(a,b);
        faces.push({v:keep,sides:20,neg:t.sign<0},{v:keep===a?b:a,sides:20,drop:true}); sum+=t.sign*keep;
      }else{const v=rollDie(t.sides);faces.push({v,sides:t.sides,neg:t.sign<0});sum+=t.sign*v;}
    }
  });
  const kept=faces.filter(f=>!f.drop), one20=kept.length===1&&kept[0].sides===20;
  return {label:exprLabel(e)+(double?" (critical, dice doubled)":""),faces,total:sum+e.mod,crit:one20&&kept[0].v===20,fumble:one20&&kept[0].v===1};
}
const trayExpr=()=>({terms:[{n:V.dice.n,sides:V.dice.sides,sign:1}],mod:V.dice.mod,mode:V.dice.sides===20?V.dice.mode:"normal"});
const myPresets=()=>S.presets[S.user.email]||(S.presets[S.user.email]=[]);
function pushRoll(L,hist){V.lastRoll=L;V.rolls.unshift(hist);V.rolls=V.rolls.slice(0,10);V.fresh=true;}
function doRoll(){const r=rollExpr(trayExpr());pushRoll({kind:"one",r},{label:r.label,total:r.total});}
function rollPreset(id){
  const p=myPresets().find(x=>x.id===id);if(!p)return;
  const prep=(str,isDmg)=>{const e=str&&parseExpr(str);if(!e)return null;if(isDmg)e.mode="normal";else if(e.mode==="normal")e.mode=V.dice.mode;return e;};
  const h=prep(p.hit,false),d=prep(p.dmg,true),hit=h&&rollExpr(h),dmg=d&&rollExpr(d);
  pushRoll({kind:"preset",pid:p.id,name:p.name,hit,dmg},{label:p.name,total:[hit&&hit.total+(dmg?" to hit":""),dmg&&dmg.total+(hit?" dmg":"")].filter(Boolean).join(" · ")});
}
function critDamage(){
  const L=V.lastRoll,p=myPresets().find(x=>x.id===L?.pid);if(!p||!L.dmg)return;
  const e=parseExpr(p.dmg);e.mode="normal";L.dmg=rollExpr(e,true);L.critDone=true;
  V.rolls[0]={label:p.name+" (critical)",total:`${L.hit.total} to hit · ${L.dmg.total} dmg`};V.fresh=true;
}

function bindAuth(){
  $("#swapAuth")?.addEventListener("click",()=>{V.authMode=V.authMode==="login"?"signup":"login";render();});
  $("#demoBtn")?.addEventListener("click",()=>{
    S.user={email:"demo@rulebook.app",name:"Demo GM"};
    if(!S.rulesets.some(r=>r.owner==="Demo GM")) S.rulesets.push(demoRuleset("Demo GM"));
    if(!S.presets["demo@rulebook.app"]) S.presets["demo@rulebook.app"]=[{id:uid(),name:"Longsword",hit:"1d20+5",dmg:"1d8+3"},{id:uid(),name:"Fire Bolt",hit:"1d20+5",dmg:"1d10"},{id:uid(),name:"Stealth check",hit:"1d20+4",dmg:""}];
    save();go("home");});
  $("#authForm")?.addEventListener("submit",e=>{e.preventDefault();
    const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value;
    if(V.authMode==="login"){
      const u=S.users[em];
      if(!u){$("#aerr").textContent="No account uses that email. Create an account instead.";return;}
      if(u.pw!==pw){$("#aerr").textContent="That password doesn't match this account.";return;}
      S.user={email:em,name:u.name};save();go("home");
    }else{
      if(S.users[em]){$("#aerr").textContent="An account already uses that email. Log in instead.";return;}
      V.pending={em,pw};V.authStep=2;render();$("#dn")?.focus();
    }});
  $("#setupForm")?.addEventListener("submit",e=>{e.preventDefault();
    const name=$("#dn").value.trim();if(!name)return;
    S.users[V.pending.em]={pw:V.pending.pw,name};S.user={email:V.pending.em,name};
    V.authStep=1;V.pending=null;save();go("home");});
}

function rulesList(r){
  const rul=id=>(r.rulings||[]).filter(z=>z.rule===id).map(z=>`<div class="rul-inline"><b>GM ruling · ${fmtDate(z.date)}</b><p>${linkConds(esc(z.a))}</p></div>`).join("");
  let list=rulesFor(r);const f=V.filter,q=V.q.trim().toLowerCase();
  if(f==="Official")list=list.filter(x=>x.src==="Official");
  else if(f==="Changed by GM")list=list.filter(x=>x.src!=="Official");
  else if(CATS.includes(f))list=list.filter(x=>x.cat===f);
  if(q)list=list.filter(x=>(x.title+" "+x.text).toLowerCase().includes(q));
  const chips=["All","Changed by GM","Official",...CATS].map(c=>`<button class="chip ${V.filter===c?"on":""}" data-filter="${c}" aria-pressed="${V.filter===c}">${c}</button>`).join("");
  const groups=CATS.map(cat=>{const items=list.filter(x=>x.cat===cat);if(!items.length)return"";
    return `<details class="grp" open><summary>${ic("chev",16,2.2).replace('class="i"','class="i chev"')}${cat}<span class="n">${items.length}</span></summary>
      ${items.map(x=>`<article class="rule"><header><h4>${esc(x.title)}</h4>${srcTag(x.src)}</header><p class="rtext">${linkConds(esc(x.text))}</p>
        ${x.src==="Modified"?`<details class="orig"><summary>See the official rule</summary><p>${linkConds(esc(x.orig))}</p></details>`:""}${rul(x.id)}</article>`).join("")}</details>`;}).join("");
  return `<div class="toolbar"><div class="searchbox">${ic("search",18)}<input class="field" id="q" placeholder="Search rules" value="${esc(V.q)}" aria-label="Search rules"></div><div class="chips">${chips}</div></div>
  ${groups||empty("search","No rules match","Clear the search or pick another filter.",`<button class="btn ghost" data-clear>Clear search and filters</button>`)}`;
}

function pviewPage(){

function condCard(c){
  return `<article class="cond" id="cond-${c.id}"><h3>${c.name}</h3><p class="csum">${c.sum}</p>
    ${c.levels?`<ol class="lv">${c.levels.map(l=>`<li>${l}</li>`).join("")}</ol>`:""}
    <ul ${c.levels?'style="margin-top:8px"':""}>${c.fx.map(f=>`<li>${linkConds(f,c.id)}</li>`).join("")}</ul></article>`;
}
function condsPage(){
  const q=V.cq.trim().toLowerCase();
  const list=CONDS.filter(c=>!q||(c.name+" "+c.sum+" "+c.fx.join(" ")+" "+(c.levels||[]).join(" ")).toLowerCase().includes(q));
  return `${head("shield","Conditions","What each condition does under the D&D 5e rules. Tap a condition name anywhere in your rules to see it.")}
  <div class="toolbar"><div class="searchbox">${ic("search",18)}<input class="field" id="cq" placeholder="Search conditions" value="${esc(V.cq)}" aria-label="Search conditions"></div></div>
  ${list.length?`<div class="cgrid">${list.map(condCard).join("")}</div>`:empty("search","No conditions match","Try a different word.","")}
  <p class="hint" style="margin-top:24px">Summarized from the D&D 5e System Reference Document 5.1 by Wizards of the Coast, available under CC BY 4.0.</p>`;
}
function rulingsSection(r,gm){
  const all=rulesFor(r), nameOf=id=>all.find(x=>x.id===id)?.title;
  const list=[...(r.rulings||[])].sort((a,b)=>b.date.localeCompare(a.date));
  const items=list.map(x=>`<article class="ruling"><div class="meta"><span>${fmtDate(x.date)}</span>${x.rule&&nameOf(x.rule)?`<span class="tag">About: ${esc(nameOf(x.rule))}</span>`:""}
      ${gm?`<span style="flex:1"></span><button class="act bad no-print" data-delruling="${x.id}">${ic("trash",15)}Remove</button>`:""}</div>
    <p class="q">${linkConds(esc(x.q))}</p><p class="a">${linkConds(esc(x.a))}</p></article>`).join("");
  const form=gm&&V.rulingForm?`<form class="panel no-print" id="rulingForm">
    <label class="lb" for="rq" style="margin-top:0">What came up at the table?</label>
    <input class="field" id="rq" required placeholder="e.g. Can you jump off a balcony and attack in the same turn?">
    <label class="lb" for="ra">Your ruling</label>
    <textarea class="field" id="ra" required placeholder="How you decided it, so it plays the same way next time."></textarea>
    <label class="lb" for="rr">Related rule (optional)</label>
    <select class="field" id="rr"><option value="">None</option>${all.map(x=>`<option value="${x.id}">${esc(x.title)}</option>`).join("")}</select>
    <div class="row"><button class="btn">Save ruling</button><button type="button" class="btn ghost" data-cancelruling>Cancel</button></div></form>`:"";
  const none=gm?(V.rulingForm?"":`<div class="list no-print" style="margin-top:12px">${empty("gavel","No rulings yet","When you make a call mid-session, log it here so it plays the same way next time.","")}</div>`)
    :`<div class="list no-print" style="margin-top:12px">${empty("gavel","No rulings yet","Your GM hasn't logged any rulings for this campaign yet.","")}</div>`;
  return `<h2>${gm?"Rulings":"GM rulings"}<span class="grow"></span>${gm&&!V.rulingForm?`<button class="btn ghost no-print" data-addruling>${ic("plus",16,2.2)}Log a ruling</button>`:""}</h2>
  <p class="muted" style="margin:-6px 0 4px">${gm?"Calls you've made during play. Logging them keeps future calls consistent, and your players can see them.":"Calls your GM has made during play. They'll apply the same way next time."}</p>
  ${form}${items||none}`;
}
function printHead(r){
  const d=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
  return `<div class="print-only ph-head"><span>${esc(r.campaign)} · Run by ${esc(r.owner)} · Based on ${esc(r.base)}</span><span>Printed from Rulebook, ${d}</span></div>`;
}
function printRules(){
  if(V.filter!=="All"||V.q){V.filter="All";V.q="";render();}
  document.querySelectorAll("details").forEach(d=>d.open=true);
  setTimeout(()=>window.print(),50);
}
function notFound(){return `${head("info","Page not found","This ruleset was removed. Go back to your dashboard.")}`;}

/* ---------- Modals ---------- */
function faceHTML(f){return `<span class="face ${f.drop?"drop":f.v===f.sides?"max":f.v===1?"min":""}">${f.neg?"−":""}${f.v}</span>`;}
function resultBlock(r,small){
  return `<div class="tot ${small?"sm":""} ${r.crit?"crit":r.fumble?"fumble":""}">${r.total}</div>
    <div class="faces">${r.faces.map(faceHTML).join("")}</div>
    <div class="lbl">${esc(r.label)}${r.crit?" · Natural 20!":r.fumble?" · Natural 1":""}</div>`;
}
function diceModal(){
  const d=V.dice, L=V.lastRoll, ps=myPresets(), pd=V.presetDraft||{};
  const dieBtns=DICE.map(n=>`<button class="die ${d.sides===n?"on":""}" data-sides="${n}" aria-pressed="${d.sides===n}">${ic("d"+n,24,1.6)}d${n}</button>`).join("");
  const modes=`<div class="modes" role="group" aria-label="Mode for d20 rolls"><span class="hint" style="align-self:center">d20 rolls:</span>${[["normal","Normal"],["adv","Advantage"],["dis","Disadvantage"]].map(([k,l])=>`<button class="chip ${d.mode===k?"on":""}" data-mode="${k}" aria-pressed="${d.mode===k}">${l}</button>`).join("")}</div>`;
  let res;
  if(!L) res=`<div class="lbl">Pick your dice and press Roll, or tap one of your saved rolls.</div>`;
  else if(L.kind==="one") res=resultBlock(L.r);
  else if(!(L.hit&&L.dmg)) res=`<div class="lbl"><b style="color:var(--ink)">${esc(L.name)}</b></div>${resultBlock(L.hit||L.dmg)}`;
  else res=`<div class="lbl"><b style="color:var(--ink)">${esc(L.name)}</b></div>
    <div class="dsplit"><div><small>Attack or check</small>${resultBlock(L.hit,1)}</div><div><small>Damage</small>${resultBlock(L.dmg,1)}</div></div>
    ${L.hit.crit&&!L.critDone?`<button class="btn" data-critdmg style="background:var(--gm);color:var(--surface)">Roll critical damage (dice doubled)</button>`:""}`;
  const pform=V.presetForm?`<form class="pform" id="presetForm">
    <label class="lb" for="pn" style="margin-top:0">Name</label><input class="field" id="pn" required value="${esc(pd.name||"")}" placeholder="e.g. Longsword">
    <div class="two"><div><label class="lb" for="ph">Attack or check</label><input class="field" id="ph" value="${esc(pd.hit||"")}" placeholder="1d20+5" autocomplete="off"></div>
    <div><label class="lb" for="pdm">Damage or effect</label><input class="field" id="pdm" value="${esc(pd.dmg||"")}" placeholder="1d8+3" autocomplete="off"></div></div>
    <p class="hint" style="margin:6px 0 0">Use dice notation like 1d20+5 or 2d6+1d8+3. Fill in one or both.</p>
    <div class="err">${esc(V.presetErr||"")}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">Save roll</button><button type="button" class="btn ghost" data-cancelpreset>Cancel</button></div></form>`:"";
  const saved=`<div class="presets"><div style="display:flex;align-items:center;gap:8px"><b style="flex:1">Saved rolls</b>${V.presetForm?"":`<button class="act" data-newpreset>${ic("plus",15,2.2)}New saved roll</button>`}</div>
    ${ps.length?`<div class="plist">${ps.map(p=>`<div class="pchip"><button class="pr-go" data-preset="${p.id}"><b>${esc(p.name)}</b><span>${esc([p.hit,p.dmg].filter(Boolean).join(" · "))}</span></button><button class="px" data-delpreset="${p.id}" aria-label="Delete ${esc(p.name)}">${X(16)}</button></div>`).join("")}</div>`
      :(V.presetForm?"":`<p class="hint" style="margin:4px 0 0">Save rolls you make often, like an attack and its damage, and roll them with one tap.</p>`)}
    ${pform}</div>`;
  const hist=V.rolls.slice(1).map(h=>`<li><span>${esc(h.label)}</span><strong>${esc(h.total)}</strong></li>`).join("");
  return `<div class="overlay" data-close><div class="modal dice" role="dialog" aria-modal="true" aria-labelledby="mh">
    <div style="display:flex;align-items:center;gap:8px"><h3 id="mh" style="flex:1;margin:0">Dice roller</h3><button class="iconbtn" data-closebtn aria-label="Close">${X()}</button></div>
    <p class="fair">Every roll is completely random, generated by your device's secure random number generator.</p>
    <div class="dgrid" role="group" aria-label="Die type">${dieBtns}</div>
    <div class="dctl">
      <div><label>Number of dice</label><div class="step"><button data-n="-1" aria-label="Fewer dice">${ic("minus",16,2.2)}</button><output aria-live="polite">${d.n}</output><button data-n="1" aria-label="More dice">${ic("plus",16,2.2)}</button></div></div>
      <div><label>Modifier</label><div class="step"><button data-m="-1" aria-label="Lower modifier">${ic("minus",16,2.2)}</button><output aria-live="polite">${d.mod>0?"+"+d.mod:d.mod}</output><button data-m="1" aria-label="Raise modifier">${ic("plus",16,2.2)}</button></div></div>
    </div>
    ${modes}
    <button class="btn rollbtn" data-roll>${ic("dice",18)}Roll ${esc(exprLabel(trayExpr(),false))}</button>
    <div class="dres ${V.fresh?"fresh":""}" aria-live="polite">${res}</div>
    ${saved}
    ${hist?`<div class="dhist"><b>Earlier rolls</b><ol>${hist}</ol></div>`:""}
    ${V.rolls.length?`<div class="row" style="margin-top:12px"><button class="btn ghost" data-clearrolls>Clear history</button></div>`:""}
  </div></div>`;
}

function modalHTML(){
  const m=V.modal;if(!m)return"";if(m.type==="dice")return diceModal();
  if(m.type==="cond"){const c=CONDS.find(x=>x.id===m.id);if(!c)return"";
    return `<div class="overlay" data-close><div class="modal" role="dialog" aria-modal="true" aria-label="${c.name}">
      <div style="display:flex;justify-content:flex-end;margin:-10px -10px -24px 0"><button class="iconbtn" data-closebtn aria-label="Close">${X()}</button></div>${condCard(c)}
      <div class="row"><button class="btn ghost" data-go="conds">${ic("shield",16)}See all conditions</button></div></div></div>`;}const r=byId(m.id);if(!r)return"";
  const role=m.type==="leave"?"pl":"gm";
  const wrap=inner=>`<div class="overlay" data-close data-role="${role}"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh">${inner}</div></div>`;
  if(m.type==="share")return wrap(`<h3 id="mh">Share ${esc(r.campaign)}</h3>
    <p class="muted" style="margin:0">Anyone with this link can join as a player and read the ruleset. They can't edit it.</p>
    ${r.shareCode?`<div class="copyline"><input class="field" id="shareUrl" readonly value="${shareURL(r)}" aria-label="Share link"><button class="btn" data-copy>Copy link</button></div>
      <div class="access"><b>Players with access</b>${r.access.length?`<div class="people">${r.access.map(a=>`<span class="person"><i>${esc(a[0].toUpperCase())}</i>${esc(a)}</span>`).join("")}</div>`:'<p class="muted" style="margin:4px 0 0">Nobody has joined yet.</p>'}</div>
      <div class="row"><button class="btn ghost" data-regen="${r.id}">Generate new link</button><button class="btn ghost" data-closebtn>Done</button></div>`
    :`<div class="row"><button class="btn" data-gen="${r.id}">${ic("link",16)}Generate link</button><button class="btn ghost" data-closebtn>Cancel</button></div>`}`);
  if(m.type==="leave")return wrap(`<h3 id="mh">Leave ${esc(r.campaign)}?</h3>
    <p class="muted" style="margin:0">It will be removed from your list. You'll need a new invite link to rejoin.</p>
    <div class="row"><button class="btn danger" data-doleave="${r.id}">Leave campaign</button><button class="btn ghost" data-closebtn>Cancel</button></div>`);
  if(m.type==="delete")return wrap(`<h3 id="mh">Delete ${esc(r.name)}?</h3>
    <p class="muted" style="margin:0">Players in this campaign will lose access to its rules.</p>
    <div class="row"><button class="btn danger" data-dodel="${r.id}">Delete ruleset</button><button class="btn ghost" data-closebtn>Cancel</button></div>`);
}

/* ---------- Render ---------- */
function render(){
  hexN=0;
  const root=$("#root");
  if(!S.user){root.innerHTML=authView();bindAuth();return;}
  const pages={home:homePage,gm:gmPage,newRuleset:newRulesetPage,edit:editPage,view:viewPage,player:playerPage,join:joinPage,pview:pviewPage,conds:condsPage};
  const role=roleOf(V.view);
  root.innerHTML=`<div class="app">${sidebar()}
    <div class="main" ${role?`data-role="${role}"`:""}><div class="topbar"><button class="iconbtn menu-btn" id="menu" aria-label="Open menu" aria-expanded="${V.sideOpen}">${ic("menu",20)}</button>${crumbs()}
      <div class="tb-right"><button class="tb-dice" data-dice>${ic("dice",16)}Roll dice</button></div></div>
    <div class="scroll">${cover(role)}<main class="page">${(pages[V.view]||homePage)()}</main></div></div></div>
    ${V.sideOpen?'<div class="scrim" data-scrim></div>':""}${tabbar(role)}${modalHTML()}`;
  const wasFresh=V.fresh;V.fresh=false;
  bind();
  if(V.focus){document.querySelector("#root "+V.focus)?.focus({preventScroll:true});V.focus=null;}
  if(wasFresh)document.querySelector("#root .dres")?.scrollIntoView({block:"nearest"});
}
function tabbar(role){
  const t=(go,icon,label,on,r)=>`<button data-go="${go}" ${r?`data-role="${r}"`:""} class="${on?"on":""}" ${on?'aria-current="page"':""}>${ic(icon,22)}<span>${label}</span></button>`;
  return `<nav class="tabbar" aria-label="Quick navigation">${t("home","home","Home",V.view==="home")}${t("gm","book","GM",role==="gm","gm")}
    <button class="dicetab" data-dice>${ic("dice",22)}<span>Dice</span></button>${t("player","sword","Player",role==="pl","pl")}${t("conds","shield","Conditions",V.view==="conds")}</nav>`;
}
function on(sel,fn){document.querySelectorAll("#root "+sel).forEach(el=>el.addEventListener("click",e=>fn(el,e)));}
function bind(){
  $("#menu")?.addEventListener("click",()=>{V.sideOpen=!V.sideOpen;render();});
  on("[data-scrim]",()=>{V.sideOpen=false;render();});
  on("[data-dice]",()=>{V.menu=null;V.sideOpen=false;V.modal={type:"dice"};V.focus="[data-roll]";render();});
  on("[data-sides]",b=>{V.dice.sides=+b.dataset.sides;V.focus=`[data-sides="${b.dataset.sides}"]`;render();});
  on("[data-n]",b=>{V.dice.n=Math.min(20,Math.max(1,V.dice.n+ +b.dataset.n));V.focus=`[data-n="${b.dataset.n}"]`;render();});
  on("[data-m]",b=>{V.dice.mod=Math.min(30,Math.max(-10,V.dice.mod+ +b.dataset.m));V.focus=`[data-m="${b.dataset.m}"]`;render();});
  on("[data-mode]",b=>{V.dice.mode=b.dataset.mode;V.focus=`[data-mode="${b.dataset.mode}"]`;render();});
  on("[data-roll]",()=>{doRoll();V.focus="[data-roll]";render();});
  on("[data-clearrolls]",()=>{V.rolls=[];V.lastRoll=null;V.focus="[data-roll]";render();});
  on("[data-print]",()=>printRules());
  on("[data-cond]",b=>{V.menu=null;V.modal={type:"cond",id:b.dataset.cond};render();document.querySelector("#root .overlay .iconbtn")?.focus();});
  const cq=$("#cq");if(cq)cq.addEventListener("input",()=>{V.cq=cq.value;render();const n=$("#cq");n.focus();n.setSelectionRange(n.value.length,n.value.length);});
  on("[data-preset]",b=>{rollPreset(b.dataset.preset);V.focus=`[data-preset="${b.dataset.preset}"]`;render();});
  on("[data-critdmg]",()=>{critDamage();V.focus="[data-roll]";render();});
  on("[data-delpreset]",b=>{S.presets[S.user.email]=myPresets().filter(p=>p.id!==b.dataset.delpreset);save();V.focus="[data-roll]";render();toast("Saved roll deleted");});
  on("[data-newpreset]",()=>{const e=trayExpr(),l=exprLabel(e,false);V.presetForm=true;V.presetErr="";V.presetDraft={name:"",hit:e.terms[0].sides===20?l:"",dmg:e.terms[0].sides===20?"":l};V.focus="#pn";render();});
  on("[data-cancelpreset]",()=>{V.presetForm=false;V.presetDraft=null;V.presetErr="";V.focus="[data-newpreset]";render();});
  $("#presetForm")?.addEventListener("submit",e=>{e.preventDefault();
    const name=$("#pn").value.trim(),hit=$("#ph").value.trim(),dmg=$("#pdm").value.trim();
    V.presetDraft={name,hit,dmg};V.presetErr="";
    const norm=str=>{const x=parseExpr(str);return x&&exprLabel(x,false)+(x.mode!=="normal"?" "+x.mode:"");};
    if(!hit&&!dmg)V.presetErr="Add an attack or check roll, a damage roll, or both.";
    else if(hit&&!norm(hit))V.presetErr=`“${hit}” isn't dice notation the roller understands. Try something like 1d20+5, using d4, d6, d8, d10, d12, d20 or d100.`;
    else if(dmg&&!norm(dmg))V.presetErr=`“${dmg}” isn't dice notation the roller understands. Try something like 1d8+3, using d4, d6, d8, d10, d12, d20 or d100.`;
    if(V.presetErr){V.focus="#pn";render();return;}
    const id=uid();myPresets().push({id,name,hit:hit?norm(hit):"",dmg:dmg?norm(dmg):""});
    V.presetForm=false;V.presetDraft=null;save();V.focus=`[data-preset="${id}"]`;render();toast("Roll saved");});
  on("[data-addruling]",()=>{V.rulingForm=true;V.focus="#rq";render();});
  on("[data-cancelruling]",()=>{V.rulingForm=false;render();});
  on("[data-delruling]",b=>{const r=byId(V.id);r.rulings=(r.rulings||[]).filter(x=>x.id!==b.dataset.delruling);save();render();toast("Ruling removed");});
  $("#rulingForm")?.addEventListener("submit",e=>{e.preventDefault();const r=byId(V.id);
    r.rulings=r.rulings||[];r.rulings.unshift({id:uid(),date:new Date().toLocaleDateString("en-CA"),q:$("#rq").value.trim(),a:$("#ra").value.trim(),rule:$("#rr").value});
    V.rulingForm=false;save();render();toast("Ruling logged");});
  $("#logout")?.addEventListener("click",()=>{S.user=null;save();V.authMode="login";V.modal=null;render();});
  on("[data-go]",b=>go(b.dataset.go,b.dataset.id||null));
  on("[data-menu]",(b,e)=>{e.stopPropagation();V.menu=V.menu===b.dataset.menu?null:b.dataset.menu;render();});
  on("[data-share]",b=>{V.menu=null;V.modal={type:"share",id:b.dataset.share};render();});
  on("[data-del]",b=>{V.menu=null;V.modal={type:"delete",id:b.dataset.del};render();});
  on("[data-leave]",b=>{V.menu=null;V.modal={type:"leave",id:b.dataset.leave};render();});
  on("[data-filter]",b=>{V.filter=b.dataset.filter;render();});
  on("[data-clear]",()=>{V.filter="All";V.q="";render();});
  const q=$("#q");if(q)q.addEventListener("input",()=>{V.q=q.value;render();const n=$("#q");n.focus();n.setSelectionRange(n.value.length,n.value.length);});

  $("#newForm")?.addEventListener("submit",e=>{e.preventDefault();
    const r={id:"rs-"+uid(),owner:me(),name:$("#nn").value.trim(),campaign:$("#nc").value.trim(),desc:$("#nd").value.trim(),base:$("#nb").value,overrides:{},custom:[],rulings:[],shareCode:null,access:[]};
    S.rulesets.push(r);save();toast("Ruleset created");go("edit",r.id);});
  on("[data-ov]",b=>{V.editing=b.dataset.ov;render();$("#ovText")?.focus();});
  on("[data-cancel]",()=>{V.editing=null;render();});
  on("[data-saveov]",b=>{const r=byId(V.id),id=b.dataset.saveov,t=$("#ovText").value.trim(),o=OFFICIAL.find(x=>x.id===id);
    if(!t||t===o.text)delete r.overrides[id];else r.overrides[id]=t;V.editing=null;save();render();toast("Change saved");});
  on("[data-reset]",b=>{delete byId(V.id).overrides[b.dataset.reset];save();render();toast("Official rule restored");});
  $("#customForm")?.addEventListener("submit",e=>{e.preventDefault();
    byId(V.id).custom.push({id:uid(),title:$("#ct").value.trim(),cat:$("#cc").value,text:$("#cx").value.trim()});save();render();toast("Custom rule added");});
  on("[data-delc]",b=>{const r=byId(V.id);r.custom=r.custom.filter(c=>c.id!==b.dataset.delc);save();render();toast("Custom rule removed");});

  $("#joinForm")?.addEventListener("submit",e=>{e.preventDefault();
    const raw=$("#jl").value.trim(),c=(raw.split("/").filter(Boolean).pop()||"").toUpperCase(),r=S.rulesets.find(x=>x.shareCode===c);
    V.joinFound=null;V.joinErr="";
    if(!r)V.joinErr="No campaign uses that link. Check it with your GM, or try EMBER1.";
    else if(S.joined.includes(r.id))V.joinErr="You're already in this campaign.";
    else V.joinFound=r;
    render();if($("#jl"))$("#jl").value=raw;});
  on("[data-confirmjoin]",b=>{const r=byId(b.dataset.confirmjoin);S.joined.push(r.id);if(!r.access.includes(me()))r.access.push(me());save();toast("Added to your campaigns");go("pview",r.id);});
  on("[data-canceljoin]",()=>{V.joinFound=null;render();});

  on("[data-close]",(o,e)=>{if(e.target===o){V.modal=null;render();}});
  on("[data-closebtn]",()=>{V.modal=null;render();});
  on("[data-gen],[data-regen]",b=>{const r=byId(b.dataset.gen||b.dataset.regen);r.shareCode=code();save();render();toast("Link generated");});
  on("[data-copy]",async()=>{const i=$("#shareUrl");try{await navigator.clipboard.writeText(i.value);toast("Link copied");}catch(e){i.select();toast("Press Ctrl+C to copy");}});
  on("[data-doleave]",b=>{const r=byId(b.dataset.doleave);S.joined=S.joined.filter(x=>x!==r.id);r.access=r.access.filter(a=>a!==me());V.modal=null;save();toast("Left campaign");go("player");});
  on("[data-dodel]",b=>{const id=b.dataset.dodel;S.rulesets=S.rulesets.filter(r=>r.id!==id);S.joined=S.joined.filter(x=>x!==id);V.modal=null;save();toast("Ruleset deleted");go("gm");});
}
document.addEventListener("click",e=>{if(V.menu&&!e.target.closest(".pop,[data-menu]")){V.menu=null;render();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){if(V.menu){V.menu=null;render();}else if(V.modal){V.modal=null;render();}}});
window.addEventListener("beforeprint",()=>document.querySelectorAll("details").forEach(d=>d.open=true));
render();
</script>
</body>
</html>
